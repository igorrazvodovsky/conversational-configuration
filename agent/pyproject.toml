[project]
name = "sample-agent"
version = "0.1.0"
description = "A LangGraph agent"
requires-python = ">=3.12"
dependencies = [
  "langchain==1.2.15",
  "langgraph==1.1.6",
  "langsmith==0.7.33",
  "openai==1.109.1",
  "fastapi>=0.115.5,<1.0.0",
  "uvicorn>=0.29.0,<1.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "langgraph-cli[inmem]==0.4.21",
  "langchain-openai==1.1.9",
  "copilotkit==0.1.94",
  "ag-ui-protocol==0.1.18",
  "langgraph-api==0.7.101",
  "pip>=26.0.1",
  "langchain-anthropic==1.4.1",
  "z3-solver>=5.0.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# The scenario harness calls a real LLM: slow, costs money, needs a key.
# `uv run pytest` stays offline and fast; `pytest -m scenario` opts in.
addopts = '-m "not scenario"'
markers = [
    "scenario: end-to-end demo scenario against the live agent (docs/specs/demo-scenarios)",
]

