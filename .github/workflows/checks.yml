# The checks that run without a provider key: the offline ones
# (docs/specs/offline-checks) and the hydration ones
# (docs/specs/hydration-checks). The conversation checks are deliberately
# absent — they drive the live agent, cost money per run, and are opted into
# with `pytest -m scenario` (docs/specs/conversation-checks).
name: checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  agent:
    name: agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --dev
      - name: Product model
        run: uv run python src/product_model/validate.py
      - name: Tests
        run: uv run pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The coupling checks run the agent's half of the shared contracts and
      # compare what it builds, so this job needs both toolchains
      # (docs/specs/offline-checks design, decision 4).
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # --ignore-scripts skips the postinstall that provisions the agent; the
      # step below does it explicitly, so a failure names which half broke.
      - name: Install the frontend
        run: npm ci --ignore-scripts
      - name: Install the agent
        run: uv sync --dev
        working-directory: agent
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test

  # Its own job, on the same argument the frontend job splits its two installs:
  # a failure should name which thing broke. This one needs a browser and no
  # agent — the tree it measures is drawn before any fetch resolves
  # (docs/specs/hydration-checks design 3).
  hydration:
    name: hydration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install the frontend
        run: npm ci --ignore-scripts
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Hydration
        run: npm run test:hydration
