# The checks that run without a provider key: the offline checks
# (docs/specs/offline-checks) and the interface checks
# (docs/specs/interface-checks), both under `npm test`. The conversation
# checks are deliberately absent — they drive
# the live agent, cost money per run, and are opted into with `pytest -m
# scenario` (docs/specs/conversation-checks).
name: checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  agent:
    name: agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --dev
      - name: Product model
        run: uv run python src/product_model/validate.py
      - name: Tests
        run: uv run pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Both frontend tiers read the agent's half of the shared contracts:
      # the coupling checks compare what it builds (docs/specs/offline-checks
      # design, decision 4), and the interface checks take their agreement
      # payloads from the same dump (docs/specs/interface-checks). So this job
      # needs both toolchains.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # --ignore-scripts skips the postinstall that provisions the agent; the
      # step below does it explicitly, so a failure names which half broke.
      - name: Install the frontend
        run: npm ci --ignore-scripts
      - name: Install the agent
        run: uv sync --dev
        working-directory: agent
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
